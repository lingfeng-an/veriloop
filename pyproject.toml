[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "veriloop"
version = "0.1.0"
description = "VeriLoop - Independent Verification for Autonomous LLM Research"
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "VeriLoop Contributors" }]
keywords = ["llm", "verification", "evaluation", "research", "knowledge-base"]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Operating System :: OS Independent",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "typer>=0.12,<1.0",
    "rich>=13.0,<14.0",
    "pyyaml>=6.0,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/veriloop"]

[tool.uv]
package = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "experiments"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Fixture data file holds long natural-language excerpts that cannot be
# meaningfully wrapped. E501 (line too long) is waived for this file only.
"src/veriloop/fixtures.py" = ["E501"]
